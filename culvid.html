<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>culvid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #ffffff; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    h2 { margin-bottom: 14px; font-size: 1.4rem; color: #00e676; letter-spacing: 0.5px; }
    .player-box { width: 100%; max-width: 720px; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
    video { width: 100%; max-height: 60vh; display: block; outline: none; }
    .controls { width: 100%; max-width: 720px; margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
    textarea { width: 100%; height: 110px; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: #fff; font-size: 0.85rem; resize: vertical; font-family: monospace; }
    .btn-row { display: flex; gap: 8px; }
    .btn { flex: 1; background: #00e676; color: #000; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .btn:active { background: #00c853; }
    .clear-btn { background: #333; color: #fff; border: none; padding: 14px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    #status { margin-top: 12px; font-size: 0.85rem; color: #aaa; text-align: center; }
  </style>
</head>
<body>

  <h2>culvid</h2>

  <div class="player-box">
    <video id="videoPlayer" controls playsinline></video>
  </div>

  <div class="controls">
    <textarea id="b64Input" placeholder="Paste raw Base64 string or data:video/mp4;base64,... here"></textarea>
    
    <div class="btn-row">
      <button type="button" class="btn" onclick="loadBase64()">Play Base64 Video</button>
      <button type="button" class="clear-btn" onclick="clearPlayer()">Clear</button>
    </div>
  </div>

  <div id="status">Paste your Base64 video string above and tap Play.</div>

  <script>
    const videoPlayer = document.getElementById('videoPlayer');
    const b64Input = document.getElementById('b64Input');
    const statusText = document.getElementById('status');

    function loadBase64() {
      let raw = b64Input.value.trim();
      if (!raw) {
        statusText.textContent = "Please paste a Base64 string first.";
        return;
      }

      // Remove line breaks or spaces that break data URIs
      raw = raw.replace(/\s+/g, '');

      // Automatically add the data URI prefix if only raw Base64 was pasted
      const dataUri = raw.startsWith('data:') ? raw : 'data:video/mp4;base64,' + raw;

      statusText.textContent = "Loading video...";
      videoPlayer.src = dataUri;
      videoPlayer.load();
      
      videoPlayer.play().then(() => {
        statusText.textContent = "Playing Base64 video.";
      }).catch(() => {
        statusText.textContent = "Video loaded. Tap the play icon on the screen.";
      });
    }

    function clearPlayer() {
      b64Input.value = '';
      videoPlayer.pause();
      videoPlayer.removeAttribute('src');
      videoPlayer.load();
      statusText.textContent = "Cleared. Ready for a new Base64 string.";
    }

    videoPlayer.addEventListener('error', function() {
      statusText.textContent = "Error: Invalid Base64 string or unsupported video codec.";
    });
  </script>

</body>
</html>
