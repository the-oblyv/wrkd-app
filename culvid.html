<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>culvid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #ffffff; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    h2 { margin-bottom: 16px; font-size: 1.3rem; color: #00e676; }
    .player-box { width: 100%; max-width: 720px; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
    video { width: 100%; max-height: 65vh; display: block; outline: none; }
    .controls { width: 100%; max-width: 720px; margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
    .btn { background: #00e676; color: #000; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; text-align: center; cursor: pointer; }
    .btn:active { background: #00c853; }
    input[type="file"] { display: none; }
    .url-group { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: #fff; font-size: 0.95rem; }
    .url-btn { background: #2979ff; color: #fff; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; }
    #status { margin-top: 10px; font-size: 0.85rem; color: #aaa; text-align: center; word-break: break-all; }
  </style>
</head>
<body>

  <h2>Video Watcher</h2>

  <div class="player-box">
    <!-- playsinline prevents forced fullscreen bugs in Android WebView -->
    <video id="videoPlayer" controls playsinline></video>
  </div>

  <div class="controls">
    <!-- Local File Picker -->
    <label class="btn" for="fileInput">Choose Video from Phone</label>
    <input type="file" id="fileInput" accept="video/*">

    <!-- Direct URL Loader -->
    <div class="url-group">
      <input type="text" id="urlInput" placeholder="Paste direct .mp4 / .webm link...">
      <button class="url-btn" onclick="loadUrl()">Load</button>
    </div>
  </div>

  <div id="status">No video loaded. Tap the green button above.</div>

  <script>
    const videoPlayer = document.getElementById('videoPlayer');
    const fileInput = document.getElementById('fileInput');
    const urlInput = document.getElementById('urlInput');
    const statusText = document.getElementById('status');
    let currentBlobUrl = null;

    // Handle local phone video selection
    fileInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      // Free memory from previous video if one was loaded
      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
      }

      currentBlobUrl = URL.createObjectURL(file);
      videoPlayer.src = currentBlobUrl;
      videoPlayer.play();
      statusText.textContent = "Playing: " + file.name;
    });

    // Handle direct web video URLs
    function loadUrl() {
      const url = urlInput.value.trim();
      if (!url) return;

      videoPlayer.src = url;
      videoPlayer.play();
      statusText.textContent = "Streaming: " + url;
    }
  </script>

</body>
</html>
